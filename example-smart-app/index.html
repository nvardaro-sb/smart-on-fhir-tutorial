<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <title>Example-SMART-App</title>

    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
  </head>
  <body>
    <div id='errors'>
    </div>
    <div id="loading" class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
    <div id='holder' >
      <h2>Example-SMART-App</h2>

      <h2>Patient Resource</h2>
      <table>
        <tr>
          <th>First Name:</th>
          <td id='fname'></td>
        </tr>
        <tr>
          <th>Last Name:</th>
          <td id='lname'></td>
        </tr>
        <tr>
          <th>Gender:</th>
          <td id='gender'></td>
        </tr>
        <tr>
          <th>Date of Birth:</th>
          <td id='birthdate'></td>
        </tr>
      </table>
      <h2>Observation Resource</h2>
      <table>
        <tr>
          <th>Height:</th>
          <td id='height'></td>
        </tr>
        <tr>
          <th>Systolic Blood Pressure:</th>
          <td id='systolicbp'></td>

        </tr>
        <tr>
          <th>Diastolic Blood Pressure:</th>
          <td id='diastolicbp'></td>
        </tr>
        <tr>
          <th>LDL:</th>
          <td id='ldl'></td>
        </tr>
        <tr>
          <th>HDL:</th>
          <td id='hdl'></td>
        </tr>
      </table>
    </div>
    <!-- Required JS files to enable this page to embed within an MPage -->
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/6.26.0/polyfill.min.js'></script>
      <script src='./lib/js/cerner-smart-embeddable-lib-1.0.0.min.js'></script>
    -->

    <!-- Modern FHIR Client JS Library (LOCAL) -->
    <script src='./lib/js/fhirclient-modern.js'></script>
    
    <!-- Application-level javascript-->
    <script src='./src/js/example-smart-app.js'></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script>
      // Modern async/await approach
      async function initApp() {
        console.log('📱 Modern SMART app starting...');
        console.log('🌐 Current URL:', window.location.href);
        console.log('📍 URL Parameters:', Object.fromEntries(new URLSearchParams(window.location.search)));
        
        try {
          const data = await extractData();
          console.log('✅ Data extraction successful');
          drawVisualization(data);
        } catch (error) {
          console.error('❌ Data extraction failed:', error);
          showError(error.message || 'Unknown error occurred');
        }
      }
      
      function showError(message) {
        $('#loading').hide();
        
        let errorHtml = '<div style="background: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; margin: 10px 0; border-radius: 5px; color: #721c24;">';
        errorHtml += '<h3 style="margin-top: 0;">❌ FHIR Service Error</h3>';
        errorHtml += '<p><strong>Error:</strong> ' + message + '</p>';
        errorHtml += '<p><strong>This is using the modern FHIR client with local library.</strong></p>';
        errorHtml += '<p><strong>Possible solutions:</strong></p>';
        errorHtml += '<ul>';
        errorHtml += '<li>Check if your OAuth2 flow completed successfully</li>';
        errorHtml += '<li>Verify your client credentials are still valid</li>';
        errorHtml += '<li>Ensure you have the required scopes (patient/Patient.read patient/Observation.read)</li>';
        errorHtml += '<li>Check if the FHIR server is accessible</li>';
        errorHtml += '</ul>';
        errorHtml += '<p><strong>Debug info:</strong></p>';
        errorHtml += '<ul>';
        errorHtml += '<li>URL: ' + window.location.href + '</li>';
        errorHtml += '<li>FHIR Client: ' + (typeof window.FHIR !== 'undefined' ? 'Modern v2.5.3 (Local)' : 'Not loaded') + '</li>';
        errorHtml += '<li>Timestamp: ' + new Date().toISOString() + '</li>';
        errorHtml += '</ul>';
        errorHtml += '<p><em>Check browser console for detailed logs</em></p>';
        errorHtml += '<p><strong>Next steps:</strong></p>';
        errorHtml += '<ul>';
        errorHtml += '<li><a href="test-local-fhir.html" style="color: #007bff;">🧪 Try test page</a> to restart OAuth flow</li>';
        errorHtml += '<li><a href="standalone.html" style="color: #007bff;">🖥️ Try standalone mode</a></li>';
        errorHtml += '</ul>';
        errorHtml += '</div>';
        
        $('#errors').html(errorHtml);
        
        console.error('=== FHIR App Error Details ===');
        console.error('Error message:', message);
        console.error('Current URL:', window.location.href);
        console.error('URL parameters:', new URLSearchParams(window.location.search));
        console.error('Hash parameters:', window.location.hash);
        console.error('Available global objects:', {
          FHIR: typeof window.FHIR,
          jQuery: typeof window.jQuery,
          $: typeof window.$
        });
      }

      // Start the app when jQuery is ready
      $(document).ready(function() {
        console.log('📚 jQuery ready, starting modern SMART app...');
        initApp();
      });

      // Global error handlers
      window.addEventListener('error', function(event) {
        console.error('💥 JavaScript error:', event.error);
        showError('JavaScript error: ' + event.message);
      });

      window.addEventListener('unhandledrejection', function(event) {
        console.error('🚫 Unhandled promise rejection:', event.reason);
        showError('Promise rejection: ' + event.reason);
      });
    </script>
  </body>
</html>
