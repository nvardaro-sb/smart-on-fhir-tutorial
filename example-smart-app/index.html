<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <title>Example-SMART-App</title>

    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
  </head>
  <body>
    <div id='errors'>
    </div>
    <div id="loading" class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
    <div id='holder' >
      <h2>Example-SMART-App</h2>

      <h2>Patient Resource</h2>
      <table>
        <tr>
          <th>First Name:</th>
          <td id='fname'></td>
        </tr>
        <tr>
          <th>Last Name:</th>
          <td id='lname'></td>
        </tr>
        <tr>
          <th>Gender:</th>
          <td id='gender'></td>
        </tr>
        <tr>
          <th>Date of Birth:</th>
          <td id='birthdate'></td>
        </tr>
      </table>
      <h2>Observation Resource</h2>
      <table>
        <tr>
          <th>Height:</th>
          <td id='height'></td>
        </tr>
        <tr>
          <th>Systolic Blood Pressure:</th>
          <td id='systolicbp'></td>

        </tr>
        <tr>
          <th>Diastolic Blood Pressure:</th>
          <td id='diastolicbp'></td>
        </tr>
        <tr>
          <th>LDL:</th>
          <td id='ldl'></td>
        </tr>
        <tr>
          <th>HDL:</th>
          <td id='hdl'></td>
        </tr>
      </table>
    </div>
    <!-- Required JS files to enable this page to embed within an MPage -->
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/6.26.0/polyfill.min.js'></script>
      <script src='./lib/js/cerner-smart-embeddable-lib-1.0.0.min.js'></script>
    -->

    <!-- Application-level javascript-->
    <script src='./src/js/example-smart-app.js'></script>

    <!-- FHIR Client JS Library -->
    <script src='./lib/js/fhir-client-v0.1.12.js'></script>

    <!-- Prevent session bleed caused by single threaded embedded browser and sessionStorage API -->
    <!-- https://github.com/cerner/fhir-client-cerner-additions -->
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script>
      extractData().then(
        //Display Patient Demographics and Observations if extractData was success
        function(p) {
          drawVisualization(p);
        },

        //Display detailed error information if extractData failed
        function() {
          $('#loading').hide();
          var errorHtml = '<div style="background: #ffe6e6; border: 1px solid #ff9999; padding: 15px; margin: 10px 0; border-radius: 5px;">';
          errorHtml += '<h3 style="color: #cc0000; margin-top: 0;">Failed to call FHIR Service</h3>';
          errorHtml += '<p><strong>Possible causes:</strong></p>';
          errorHtml += '<ul>';
          errorHtml += '<li>OAuth2 authorization failed</li>';
          errorHtml += '<li>Invalid client configuration</li>';
          errorHtml += '<li>Network connectivity issues</li>';
          errorHtml += '<li>FHIR server is unavailable</li>';
          errorHtml += '<li>Invalid redirect URI</li>';
          errorHtml += '</ul>';
          errorHtml += '<p><strong>Debug information:</strong></p>';
          errorHtml += '<ul>';
          errorHtml += '<li>Current URL: ' + window.location.href + '</li>';
          errorHtml += '<li>User Agent: ' + navigator.userAgent + '</li>';
          errorHtml += '<li>Timestamp: ' + new Date().toISOString() + '</li>';
          errorHtml += '</ul>';
          errorHtml += '<p><em>Check the browser console for detailed error logs.</em></p>';
          errorHtml += '</div>';
          $('#errors').html(errorHtml);
          
          // Log additional debug info to console
          console.error('=== FHIR App Debug Information ===');
          console.error('URL Parameters:', new URLSearchParams(window.location.search));
          console.error('Session Storage Keys:', Object.keys(window.sessionStorage || {}));
          console.error('Local Storage Keys:', Object.keys(window.localStorage || {}));
          console.error('Available global objects:', {
            FHIR: typeof window.FHIR,
            jQuery: typeof window.jQuery,
            $: typeof window.$
          });
        }
      );
    </script>
  </body>
</html>
