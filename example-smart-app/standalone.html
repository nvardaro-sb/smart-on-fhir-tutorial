<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Example-SMART-App Standalone</title>
  </head>
  <body>
    <script src='./lib/js/fhir-client-v0.1.12.js'></script>
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
    <script>
      // Simple OAuth test without external libraries
      function testOAuth() {
        const state = 'state_' + Math.random().toString(36).substr(2, 9);
        sessionStorage.setItem('oauth_state', state);
        
        const params = new URLSearchParams({
          response_type: 'code',
          client_id: 'fc4ee473-1523-46d7-ad22-7b68b3205219',
          redirect_uri: 'https://nvardaro-sb.github.io/smart-on-fhir-tutorial/example-smart-app/',
          scope: 'patient/Patient.read patient/Observation.read launch/patient openid profile',
          state: state,
          aud: 'https://fhir-ehr-code.cerner.com/r4/ec2458f2-1e24-41c8-b71b-0e701af7583d'
        });
        
        const authUrl = 'https://fhir-ehr-code.cerner.com/oauth2/authorize?' + params.toString();
        console.log('OAuth URL:', authUrl);
        window.location.href = authUrl;
      }
      
      // Run the test
      console.log('🚀 Testing OAuth with your Oracle Health config...');
      testOAuth();
    </script>
  </body>
</html>
