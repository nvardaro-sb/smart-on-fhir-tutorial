<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Simple FHIR Test - No OAuth</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .debug-section { background: #f5f5f5; border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 5px; }
      .error { background: #ffe6e6; border-color: #ff9999; }
      .success { background: #e6ffe6; border-color: #99ff99; }
      .info { background: #e6f3ff; border-color: #99ccff; }
      pre { background: white; padding: 10px; border-radius: 3px; overflow-x: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Simple FHIR Library Test</h1>
    <p>This tests basic FHIR client functionality without OAuth</p>
    
    <div id="status" class="debug-section info">
      <h3>Status</h3>
      <p>Testing FHIR library...</p>
    </div>

    <div class="debug-section">
      <h3>FHIR Client Library</h3>
      <div id="fhir-info"></div>
    </div>

    <div class="debug-section">
      <h3>Test Results</h3>
      <div id="test-results"></div>
    </div>

    <script src='./lib/js/fhir-client-v0.1.12.js'></script>
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
    <script>
      function updateStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.className = 'debug-section ' + type;
        statusDiv.innerHTML = '<h3>Status</h3><p>' + message + '</p>';
      }

      function addTestResult(testName, result, data) {
        const resultsDiv = document.getElementById('test-results');
        const testDiv = document.createElement('div');
        testDiv.style.margin = '10px 0';
        testDiv.style.padding = '10px';
        testDiv.style.border = '1px solid ' + (result === 'PASS' ? 'green' : result === 'FAIL' ? 'red' : 'orange');
        testDiv.style.borderRadius = '5px';
        testDiv.style.backgroundColor = result === 'PASS' ? '#e6ffe6' : result === 'FAIL' ? '#ffe6e6' : '#fff3cd';
        
        let html = '<h4>[' + result + '] ' + testName + '</h4>';
        if (data) {
          html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }
        testDiv.innerHTML = html;
        resultsDiv.appendChild(testDiv);
      }

      // Test 1: Check if FHIR library exists
      console.log('=== Starting FHIR Library Tests ===');
      updateStatus('Running tests...', 'info');

      // Display FHIR info
      const fhirInfo = {
        FHIR_available: typeof window.FHIR !== 'undefined',
        FHIR_type: typeof window.FHIR,
        FHIR_keys: window.FHIR ? Object.keys(window.FHIR) : [],
        oauth2_available: window.FHIR && typeof window.FHIR.oauth2 !== 'undefined',
        oauth2_keys: window.FHIR && window.FHIR.oauth2 ? Object.keys(window.FHIR.oauth2) : []
      };
      document.getElementById('fhir-info').innerHTML = '<pre>' + JSON.stringify(fhirInfo, null, 2) + '</pre>';

      if (typeof window.FHIR === 'undefined') {
        addTestResult('FHIR Library Loading', 'FAIL', 'FHIR object not found');
        updateStatus('FHIR library failed to load', 'error');
      } else {
        addTestResult('FHIR Library Loading', 'PASS', { version: window.FHIR.version || 'unknown' });
      }

      // Test 2: Check OAuth2 module
      if (window.FHIR && typeof window.FHIR.oauth2 !== 'undefined') {
        addTestResult('OAuth2 Module', 'PASS', { methods: Object.keys(window.FHIR.oauth2) });
      } else {
        addTestResult('OAuth2 Module', 'FAIL', 'OAuth2 module not available');
      }

      // Test 3: Try creating a basic FHIR client (without OAuth)
      try {
        // Try to access public FHIR data (this should work without OAuth)
        fetch('https://hapi.fhir.org/baseR4/Patient?_count=1', {
          headers: {
            'Accept': 'application/fhir+json'
          }
        })
        .then(response => {
          if (response.ok) {
            return response.json();
          } else {
            throw new Error('HTTP ' + response.status + ': ' + response.statusText);
          }
        })
        .then(data => {
          addTestResult('Public FHIR Server Access', 'PASS', { 
            total: data.total || 'unknown',
            resourceType: data.resourceType,
            entries: data.entry ? data.entry.length : 0
          });
          updateStatus('Basic FHIR access working!', 'success');
        })
        .catch(error => {
          addTestResult('Public FHIR Server Access', 'WARN', { 
            error: error.message,
            note: 'This might be due to CORS policy'
          });
        });
      } catch (error) {
        addTestResult('Public FHIR Server Access', 'FAIL', { error: error.message });
      }

      // Test 4: Test the OAuth2.authorize method itself (without calling it)
      try {
        if (window.FHIR && window.FHIR.oauth2 && window.FHIR.oauth2.authorize) {
          addTestResult('OAuth2 Authorize Method', 'PASS', 'Method is available');
          
          // Test what happens when we try to analyze the current URL for OAuth parameters
          const urlParams = new URLSearchParams(window.location.search);
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const allParams = {};
          
          urlParams.forEach((value, key) => { allParams['search_' + key] = value; });
          hashParams.forEach((value, key) => { allParams['hash_' + key] = value; });
          
          addTestResult('URL Parameter Analysis', 'INFO', {
            current_url: window.location.href,
            search_params: Object.fromEntries(urlParams),
            hash_params: Object.fromEntries(hashParams),
            combined_params: allParams
          });
          
        } else {
          addTestResult('OAuth2 Authorize Method', 'FAIL', 'authorize method not found');
        }
      } catch (error) {
        addTestResult('OAuth2 Authorize Method', 'FAIL', { error: error.message });
      }

      console.log('=== Tests Complete ===');
    </script>
  </body>
</html>
